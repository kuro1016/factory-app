<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>生产管理</title>
<style>
  html,body{margin:0;height:100%;background:#0f172a;color:#e2e8f0;
    font-family:-apple-system,"Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;flex-direction:column}
  .spin{width:38px;height:38px;border:3px solid rgba(249,115,22,.25);
    border-top-color:#f97316;border-radius:50%;animation:r 1s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  p{margin-top:16px;font-size:14px;color:#94a3b8}
</style>
</head>
<body>
  <div class="spin"></div>
  <p>正在加载生产管理系统…</p>
</body>
</html>
